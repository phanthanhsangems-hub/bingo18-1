name: Sync Bingo18 Draws

on:
  schedule:
    # Yêu cầu 6 phút/lần, NHƯNG GitHub bóp lịch chạy dày: đo thực tế
    # 07/2026 chỉ được ~12-15 run/ngày (cách nhau 60-160 phút), tức ~5%
    # tần suất mong muốn. Đây CHỈ là lưới an toàn — nguồn sync chính là
    # sync_to_supabase.py --mode watch chạy trên PC (Vietlott chặn IP
    # Cloud Run). Nếu PC tắt, dữ liệu sẽ trễ tới ~1.5 tiếng chứ không
    # phải 6 phút.
    - cron: '*/6 * * * *'
  workflow_dispatch:          # cho phép chạy tay từ GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4        # kill nếu treo (tránh tốn minutes)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .github/sync-requirements.txt

      - name: Install sync dependencies
        run: pip install -r .github/sync-requirements.txt

      - name: Warmup Cloud Run
        env:
          CLOUD_RUN_URL: https://bingo18-633959711537.asia-southeast1.run.app
        run: |
          python3 -c "
          import urllib.request, os
          url = os.environ['CLOUD_RUN_URL'] + '/api/health'
          try:
              with urllib.request.urlopen(url, timeout=10) as r:
                  print('Warmup OK:', r.read().decode()[:80])
          except Exception as e:
              print('Warmup ping failed (ok on cold start):', e)
          "

      - name: Sync draws → Cloud Run → Supabase
        env:
          CLOUD_RUN_URL:  https://bingo18-633959711537.asia-southeast1.run.app
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: python sync_to_supabase.py --mode gha
