name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/sync-draws.yml'
      - '.github/workflows/morning-digest.yml'
      - 'sync_to_supabase.py'
      - '.github/sync-requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Docker image
        run: |
          TAG=$(git rev-parse --short HEAD)
          IMAGE="asia-southeast1-docker.pkg.dev/bingo18-predictor/bingo18-images/bingo18:${TAG}"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          # --async avoids the log-streaming permission error (SA doesn't need logs bucket access)
          BUILD_ID=$(gcloud builds submit \
            --tag "${IMAGE}" \
            --project bingo18-predictor \
            --timeout 900s \
            --async \
            --format='value(id)')
          echo "Cloud Build ID: ${BUILD_ID}"
          # Poll until done
          for i in $(seq 1 90); do
            STATUS=$(gcloud builds describe "${BUILD_ID}" \
              --project bingo18-predictor \
              --format='value(status)')
            echo "  [${i}/90] status=${STATUS}"
            if [ "${STATUS}" = "SUCCESS" ]; then
              echo "Build succeeded."
              break
            elif [ "${STATUS}" = "FAILURE" ] || [ "${STATUS}" = "CANCELLED" ] || [ "${STATUS}" = "TIMEOUT" ]; then
              echo "Build failed: ${STATUS}"
              exit 1
            fi
            sleep 10
          done
          if [ "${STATUS}" != "SUCCESS" ]; then
            echo "Build timed out waiting (status=${STATUS})"; exit 1
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy bingo18 \
            --image "$IMAGE" \
            --region asia-southeast1 \
            --project bingo18-predictor \
            --quiet

      # P199: gcloud run deploy chỉ kiểm tra có tiến trình lắng nghe cổng.
      # gunicorn master bind cổng TRƯỚC khi worker import app, nên app hỏng
      # hoàn toàn vẫn qua được bước deploy — đúng như P195: deploy báo
      # success ba lần liên tiếp trong khi app trả 503 cho mọi request.
      #
      # Bước này gọi thật /healthz và đòi thân phản hồi là JSON có khoá
      # "status". Container chết thì Cloud Run trả text "Service Unavailable"
      # (không phải JSON) -> workflow đỏ, không im lặng nữa.
      # P200: dùng /api/health, KHÔNG dùng /healthz. Đo thực tế cho thấy
      # /healthz bị trả lời ở tầng biên của Google (404, không có header
      # x-cloud-trace-context lẫn "server: Google Frontend") nên không bao
      # giờ tới container — smoke test đầu tiên vì thế báo động giả trong
      # khi app hoàn toàn khoẻ. /api/health đi đúng vào Flask.
      - name: Smoke test — app phải thật sự phục vụ được
        run: |
          URL="https://bingo18-633959711537.asia-southeast1.run.app/api/health"
          for i in $(seq 1 10); do
            BODY=$(curl -s --max-time 30 "$URL" || echo '')
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo 000)
            if echo "$BODY" | python3 -c 'import sys,json; d=json.load(sys.stdin); sys.exit(0 if "status" in d else 1)' 2>/dev/null; then
              echo "OK [$i/10] HTTP $CODE — Flask đã chạy, thân phản hồi: $BODY"
              exit 0
            fi
            echo "  [$i/10] HTTP $CODE — chưa phải JSON của app: $(echo "$BODY" | head -c 80)"
            sleep 15
          done
          echo "THẤT BẠI: sau 10 lần thử app vẫn không trả JSON hợp lệ."
          echo "Container nhiều khả năng không import được — xem log Cloud Run."
          exit 1
