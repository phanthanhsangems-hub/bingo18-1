name: Dọn kho image (Artifact Registry)

# P287: kho image ~147 GB (~$14,7/tháng) vì không bao giờ xoá image cũ. Xoá
# trực tiếp, mỗi image giữ 10 bản mới nhất (scripts/don_image.sh). Người dùng
# chọn cách này ngày 05/11/2026 và cấp quyền Repository Administrator cho
# github-deploy — quyền này xoá được image nhưng KHÔNG đặt được cleanup policy
# (cần artifactregistry.repositories.update), nên không dùng policy.
# che_do=thu -> chỉ liệt kê sẽ xoá gì.
on:
  workflow_dispatch:
    inputs:
      che_do:
        description: 'thu = dry run, that = áp dụng'
        required: true
        default: 'thu'

permissions:
  contents: read

jobs:
  don:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # checkout PHAI truoc auth: checkout xoa workspace, mat file dang nhap
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Xoá image cũ
        run: bash scripts/don_image.sh "${{ github.event.inputs.che_do }}" 10
