name: Kiểm tra nhất quán dữ liệu

# Mọi lần dữ liệu sai trong quá khứ đều do NGƯỜI DÙNG nhìn thấy trước: trip
# 333 báo sai 434 kỳ, bảng tổng lệch bảng trip 1 kỳ, tổng 7/14 hiển thị sai.
# Bộ kiểm đã có nhưng chỉ chạy khi bấm tay, nên không giúp được gì.
#
# Job này chạy mỗi ngày và HỎNG khi phát hiện lệch — GitHub tự gửi email cho
# chủ repo. Nhẹ (4 request) nên chạy hằng ngày không phiền production.
on:
  schedule:
    # Chạy trong GIỜ CÓ KỲ QUAY (khoảng 06:00-22:00 giờ VN), 3 tiếng một lần.
    # Trước đây chỉ chạy 23:30 mỗi tối: lỗ hổng lúc 06h sáng phải chờ 17 tiếng
    # mới có ai báo — thực tế người dùng phát hiện trước job.
    # UTC = giờ VN - 7. 23,2,5,8,11,14 UTC = 06,09,12,15,18,21 giờ VN.
    - cron: '0 23,2,5,8,11,14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Đối chiếu dữ liệu production
        env:
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: |
          # Phân biệt hai loại hỏng, vì cách xử lý khác hẳn nhau:
          #   2 = KHÔNG CHẠY ĐƯỢC  -> app/mạng có vấn đề, chưa biết dữ liệu ra sao
          #   1 = DỮ LIỆU LỆCH     -> app sống, nhưng số liệu sai
          # Lần chạy đầu của job này chết vì header rồi in "phát hiện dữ liệu
          # không nhất quán" — nói sai hẳn chuyện đã xảy ra.
          set +e
          python scripts/kiem_tra_nhat_quan.py --n 200
          MA=$?
          set -e
          echo "ma_thoat=$MA" >> "$GITHUB_ENV"
          case "$MA" in
            0) echo "Dữ liệu nhất quán." ;;
            1) echo "::error::DỮ LIỆU LỆCH — xem chi tiết ở trên." ;;
            2) echo "::error::KHÔNG GỌI ĐƯỢC production — chưa kết luận được gì về dữ liệu." ;;
            *) echo "::error::Script thoát với mã lạ $MA" ;;
          esac
          exit $MA

      - name: Gợi ý xử lý
        if: failure()
        run: |
          if [ "${ma_thoat:-}" = "2" ]; then
            echo "KHÔNG gọi được production. Kiểm tra theo thứ tự:"
            echo "  1. App còn sống không  -> chạy workflow 'Diagnose Cloud Run'"
            echo "  2. TRIGGER_SECRET còn đúng không"
            echo "  3. Cloud Run có đang deploy dở không"
            echo "LƯU Ý: chưa kết luận được gì về tính đúng của dữ liệu."
          else
            echo "Dữ liệu LỆCH. Thường gặp nhất là thiếu kỳ:"
            echo "  - Lỗ hổng kỳ thường tự hết sau ~10 phút (watcher vá từ Vietlott)."
            echo "  - Lặp lại nhiều ngày -> kiểm tra watcher còn chạy trên máy không."
            echo "  - Bù tay: python sync_to_supabase.py --mode gaps"
          fi
