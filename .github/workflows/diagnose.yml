name: Diagnose Cloud Run

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Service description
        run: |
          echo "===== SERVICE ====="
          gcloud run services describe bingo18 \
            --region asia-southeast1 --project bingo18-predictor \
            --format="yaml(status.url, status.address, status.traffic, spec.template.spec.containers[0].image, metadata.annotations)" || true
          echo
          echo "===== INGRESS / IAM ====="
          gcloud run services describe bingo18 \
            --region asia-southeast1 --project bingo18-predictor \
            --format="value(metadata.annotations['run.googleapis.com/ingress'])" || true
          gcloud run services get-iam-policy bingo18 \
            --region asia-southeast1 --project bingo18-predictor --format=yaml || true

      - name: Revisions
        run: |
          echo "===== REVISIONS ====="
          gcloud run revisions list --service bingo18 \
            --region asia-southeast1 --project bingo18-predictor \
            --format="table(metadata.name, status.conditions[0].type, status.conditions[0].status, status.conditions[0].message)" \
            --limit 5 || true

      # Service account github-deploy hiện KHÔNG có roles/logging.viewer nên
      # bước này báo PERMISSION_DENIED. Giữ lại vì hữu ích nếu sau này cấp
      # quyền; || true để không làm hỏng cả job chẩn đoán.
      - name: Container logs (cần roles/logging.viewer)
        run: |
          echo "===== LOG CONTAINER 30 PHUT QUA ====="
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="bingo18" AND severity>=DEFAULT' \
            --project bingo18-predictor --limit 60 --freshness 30m \
            --format="value(timestamp, severity, textPayload)" || true

      - name: Probe from inside GitHub runner
        run: |
          for p in /healthz /api/health / ; do
            echo "--- $p ---"
            curl -s -i --max-time 25 "https://bingo18-633959711537.asia-southeast1.run.app$p" | head -12
            echo
          done

      # Quét toàn bộ endpoint CHỈ ĐỌC trên Postgres thật. Đây là thứ không
      # làm được từ máy dev: local chạy SQLite qua lớp dịch, nên SQL Postgres
      # gốc chưa bao giờ được kiểm chứng trên đúng backend nó sẽ chạy.
      #
      # Danh sách trong scripts/endpoints_readonly.txt đã loại 12 endpoint có
      # tác dụng phụ (gửi Telegram, ghi DB, chạy prediction cycle).
      # Giới hạn tổng của app là 200 req/phút; nghỉ 0,7s giữa các lần gọi.
      - name: Quét endpoint chỉ đọc trên production
        env:
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: |
          BASE="https://bingo18-633959711537.asia-southeast1.run.app"
          PASS=0; FAIL=0
          : > /tmp/fail.txt
          while read -r p; do
            [ -z "$p" ] && continue
            CODE=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
                   -H "X-Trigger-Secret: $TRIGGER_SECRET" "$BASE$p" || echo 000)
            case "$CODE" in
              2*|3*|4*) PASS=$((PASS+1)) ;;
              *) FAIL=$((FAIL+1)); echo "$CODE $p :: $(head -c 160 /tmp/body)" >> /tmp/fail.txt ;;
            esac
            sleep 0.7
          done < scripts/endpoints_readonly.txt
          echo "================================================"
          echo "  Khong loi 5xx : $PASS"
          echo "  Loi 5xx       : $FAIL"
          echo "================================================"
          if [ "$FAIL" -gt 0 ]; then
            echo "--- CHI TIET LOI 5xx ---"
            cat /tmp/fail.txt
            exit 1
          fi
          echo "Toan bo endpoint chi doc chay duoc tren Postgres that."
