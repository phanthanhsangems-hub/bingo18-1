name: Diagnose Cloud Run

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Service description
        run: |
          echo "===== SERVICE ====="
          gcloud run services describe bingo18 \
            --region asia-southeast1 --project bingo18-predictor \
            --format="yaml(status.url, status.address, status.traffic, spec.template.spec.containers[0].image, metadata.annotations)" || true
          echo
          echo "===== INGRESS / IAM ====="
          gcloud run services describe bingo18 \
            --region asia-southeast1 --project bingo18-predictor \
            --format="value(metadata.annotations['run.googleapis.com/ingress'])" || true
          gcloud run services get-iam-policy bingo18 \
            --region asia-southeast1 --project bingo18-predictor --format=yaml || true

      - name: Revisions
        run: |
          echo "===== REVISIONS ====="
          gcloud run revisions list --service bingo18 \
            --region asia-southeast1 --project bingo18-predictor \
            --format="table(metadata.name, status.conditions[0].type, status.conditions[0].status, status.conditions[0].message)" \
            --limit 5 || true

      # Service account github-deploy hiện KHÔNG có roles/logging.viewer nên
      # bước này báo PERMISSION_DENIED. Giữ lại vì hữu ích nếu sau này cấp
      # quyền; || true để không làm hỏng cả job chẩn đoán.
      - name: Container logs (cần roles/logging.viewer)
        run: |
          echo "===== LOG CONTAINER 30 PHUT QUA ====="
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="bingo18" AND severity>=DEFAULT' \
            --project bingo18-predictor --limit 60 --freshness 30m \
            --format="value(timestamp, severity, textPayload)" || true

      - name: Probe from inside GitHub runner
        run: |
          for p in /healthz /api/health / ; do
            echo "--- $p ---"
            curl -s -i --max-time 25 "https://bingo18-633959711537.asia-southeast1.run.app$p" | head -12
            echo
          done

      # Quét toàn bộ endpoint CHỈ ĐỌC trên Postgres thật. Đây là thứ không
      # làm được từ máy dev: local chạy SQLite qua lớp dịch, nên SQL Postgres
      # gốc chưa bao giờ được kiểm chứng trên đúng backend nó sẽ chạy.
      #
      # Danh sách trong scripts/endpoints_readonly.txt đã loại 12 endpoint có
      # tác dụng phụ (gửi Telegram, ghi DB, chạy prediction cycle).
      # Giới hạn tổng của app là 200 req/phút; nghỉ 0,7s giữa các lần gọi.
      #
      # /api/backtest cũng đã bị loại: nó train lại model qua 1000 kỳ nên mất
      # hơn 30 giây — chậm là đúng bản chất, không phải lỗi. Đây là công cụ
      # phân tích gọi tay, dashboard không đụng tới.
      # Bao loi NHUNG KHONG dung job: cac buoc doi chieu du lieu phia sau moi
      # la thu tra loi cau hoi cua nguoi dung. Hai lan chay truoc deu chet o
      # day nen khong bao gio chay toi chung. Cong don vao /tmp/job_failed roi
      # chot o buoc cuoi.
      - name: Quét endpoint chỉ đọc trên production
        continue-on-error: true
        env:
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: |
          BASE="https://bingo18-633959711537.asia-southeast1.run.app"
          PASS=0; FAIL=0; SLOW=0
          : > /tmp/fail.txt
          : > /tmp/slow.txt
          while read -r p; do
            [ -z "$p" ] && continue
            # KHONG dung "|| echo 000": curl da in http_code=000 khi transfer
            # hong, echo them mot lan nua thanh chuoi "000000" — case khong
            # khop 2*/3*/4* nen timeout bi dem NHAM thanh loi 5xx. Lan chay #9
            # bao /api/weight-optimizer "5xx" trong khi than tra ve JSON hop le,
            # that ra chi la qua 30 giay.
            # "bash -e": phep gan CODE=$(curl ...) MANG LUON ma thoat cua
            # curl, nen khi curl timeout (28) shell chet NGAY tai dong nay —
            # chua kip chay RC=$?. Lan chay #15 dung o day: khong mot dong
            # tong ket nao duoc in, ma continue-on-error che mat. Dat phep
            # gan trong "|| RC=$?" thi set -e bo qua.
            RC=0
            CODE=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
                   -H "X-Trigger-Secret: $TRIGGER_SECRET" "$BASE$p") || RC=$?
            if [ "$RC" -ne 0 ] || [ "$CODE" = "000" ]; then
              SLOW=$((SLOW+1)); echo "curl rc=$RC $p (qua 30s hoac dut ket noi)" >> /tmp/slow.txt
              sleep 0.7; continue
            fi
            case "$CODE" in
              2*|3*|4*) PASS=$((PASS+1)) ;;
              *) FAIL=$((FAIL+1)); echo "$CODE $p :: $(head -c 160 /tmp/body)" >> /tmp/fail.txt ;;
            esac
            sleep 0.7
          done < scripts/endpoints_readonly.txt
          echo "================================================"
          echo "  Khong loi 5xx : $PASS"
          echo "  Loi 5xx       : $FAIL"
          echo "  Cham/dut      : $SLOW"
          echo "================================================"
          if [ "$SLOW" -gt 0 ]; then
            echo "--- CHAM HON 30s (khong tinh la loi) ---"
            cat /tmp/slow.txt
          fi
          if [ "$FAIL" -gt 0 ]; then
            echo "--- CHI TIET LOI 5xx ---"
            cat /tmp/fail.txt
            echo "quet endpoint: $FAIL loi 5xx" >> /tmp/job_failed
          else
            echo "Toan bo endpoint chi doc chay duoc tren Postgres that."
          fi
          # Chay den day = da quet HET danh sach. Buoc chot doi dau nay;
          # thieu no nghia la vong lap bi ngat giua chung.
          touch /tmp/quet_xong

      # Kiem tra nhat quan TOAN DIEN: lay 200 ky gan nhat (draw-grid TINH tong
      # tu numbers), roi doi chieu voi current_gap ma sum-stats/triple-stats
      # bao. Bat duoc ca hai loai loi: du lieu sai VA man hinh cu.
      - name: Đối chiếu tổng & trip với 200 kỳ gần nhất
        env:
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: |
          BASE="https://bingo18-633959711537.asia-southeast1.run.app"
          TS=$(date +%s)
          H="X-Trigger-Secret: $TRIGGER_SECRET"
          # Ghep URL tuong minh — vong lap cu ghep "sum-stats&cb=" thieu dau ?
          # nen file JSON rong va script chet o json.load.
          curl -s --max-time 40 -H "$H" "$BASE/api/draw-grid?n=200&cb=$TS"  > /tmp/draw-grid.json
          curl -s --max-time 40 -H "$H" "$BASE/api/sum-stats?cb=$TS"        > /tmp/sum-stats.json
          curl -s --max-time 40 -H "$H" "$BASE/api/triple-stats?cb=$TS"     > /tmp/triple-stats.json
          for f in draw-grid sum-stats triple-stats; do
            if ! python3 -c "import json,sys; json.load(open('/tmp/$f.json'))" 2>/dev/null; then
              echo "LOI: /tmp/$f.json khong phai JSON. 200 ky tu dau:"
              head -c 200 /tmp/$f.json; echo; exit 1
            fi
          done
          python3 - <<'PYEOF'
          import json
          g = json.load(open('/tmp/draw-grid.json'))['draws']
          ss = {x['sum']: x for x in json.load(open('/tmp/sum-stats.json'))['sums']}
          tr = json.load(open('/tmp/triple-stats.json'))
          tt = {x['combo']: x for x in tr['triples']}
          maxdn = max(d['draw_number'] for d in g)
          print(f"Ky moi nhat #{maxdn} — kiem tra tren {len(g)} ky gan nhat\n")

          print("=== TONG ===")
          bad = []
          for s in range(3, 19):
              hit = [d for d in g if d['sum'] == s]
              if not hit:
                  continue                       # khong xuat hien trong 100 ky
              gap_that = maxdn - max(d['draw_number'] for d in hit)
              gap_bao  = ss[s]['current_gap']
              ok = gap_that == gap_bao
              if not ok: bad.append(f"tong {s}: that {gap_that}, bao {gap_bao}")
              print(f"  tong {s:2d}: ve gan nhat cach {gap_that:3d} ky | bang bao {gap_bao:3d} -> {'OK' if ok else 'LECH'}")

          print("\n=== TRIP ===")
          for n in range(1, 7):
              combo = str(n)*3
              hit = [d for d in g if d['numbers'] == [n, n, n]]
              gap_bao = tt[combo]['current_gap']
              if hit:
                  gap_that = maxdn - max(d['draw_number'] for d in hit)
                  ok = gap_that == gap_bao
                  if not ok: bad.append(f"trip {combo}: that {gap_that}, bao {gap_bao}")
                  print(f"  {combo}: CO ra, cach {gap_that:3d} ky | bang bao {gap_bao:3d} -> {'OK' if ok else 'LECH'}")
              else:
                  ok = gap_bao is None or gap_bao > len(g)
                  if not ok: bad.append(f"trip {combo}: khong ra trong {len(g)} ky nhung bao {gap_bao}")
                  print(f"  {combo}: khong ra trong {len(g)} ky | bang bao {gap_bao} -> {'OK' if ok else 'LECH'}")

          print(f"\nTrip gan nhat theo bang: {tr['any'].get('last_combo')} tai ky #{tr['any'].get('last_draw')}")
          trips = [d for d in g if len(set(d['numbers'])) == 1]
          print(f"Trip tim thay trong {len(g)} ky: " + (", ".join(f"#{d['draw_number']} {d['numbers'][0]}x3" for d in trips) or "khong co"))
          print()
          print(">>> " + (f"CO {len(bad)} CHO LECH:\n  " + "\n  ".join(bad) if bad else "KHOP HET — du lieu dung"))
          PYEOF

      # Đối chiếu hai nguồn tổng: /api/draw-grid TÍNH tổng từ numbers, còn
      # /api/sum-stats dùng cột sum_value lưu sẵn. Lệch nhau nghĩa là cột
      # sum_value ghi sai (watcher lấy 'total' cào từ web thay vì tự cộng).
      # Thêm tham số cachebust vì cache của app khoá theo full_path.
      - name: Đối chiếu tổng — numbers vs cột sum_value
        env:
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: |
          BASE="https://bingo18-633959711537.asia-southeast1.run.app"
          TS=$(date +%s)
          curl -s --max-time 30 -H "X-Trigger-Secret: $TRIGGER_SECRET" \
               "$BASE/api/draw-grid?n=12&cb=$TS" > /tmp/grid.json
          curl -s --max-time 30 -H "X-Trigger-Secret: $TRIGGER_SECRET" \
               "$BASE/api/sum-stats?cb=$TS" > /tmp/sums.json
          python3 - <<'PYEOF'
          import json
          g = json.load(open('/tmp/grid.json'))['draws']
          s = {x['sum']: x for x in json.load(open('/tmp/sums.json'))['sums']}
          print("=== 12 KY GAN NHAT (tong TINH TU numbers) ===")
          for d in g:
              print(f"  #{d['draw_number']}  {d['numbers']}  tong={d['sum']:2d}  {d['size']}")
          maxdn = max(d['draw_number'] for d in g)
          print()
          print("=== DOI CHIEU: current_gap cua sum-stats phai khop ===")
          bad = 0
          for d in sorted(g, key=lambda x: -x['draw_number'])[:6]:
              tong = d['sum']
              row  = s.get(tong)
              gap  = row['current_gap'] if row else None
              # ky nay cach ky moi nhat bao nhieu
              cach = maxdn - d['draw_number']
              # current_gap cua tong nay phai <= cach (vi no la lan ve GAN NHAT)
              ok = gap is not None and gap <= cach
              if not ok: bad += 1
              print(f"  #{d['draw_number']} tong {tong:2d}: cach ky moi nhat {cach:2d} "
                    f"| sum-stats bao chua ve {gap} -> {'OK' if ok else 'LECH!'}")
          print()
          moi = [d for d in g if d['draw_number'] == maxdn][0]
          print(f"KY MOI NHAT #{maxdn} = {moi['numbers']} tong {moi['sum']}")
          print(f"  sum-stats: chua ve cua tong {moi['sum']} = {s[moi['sum']]['current_gap']} (phai la 0)")
          if bad:
              print(f"\n>>> CO {bad} CHO LECH — cot sum_value nghi ghi sai")
          else:
              print("\n>>> Khop het — khong lech")
          PYEOF

      - name: Bảng tổng và bảng trip phải cùng một mốc kỳ (P207)
        env:
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: |
          BASE="https://bingo18-633959711537.asia-southeast1.run.app"
          H="X-Trigger-Secret: $TRIGGER_SECRET"
          # Goi LIEN TIEP khong cachebust — dung nhu trinh duyet lam. Truoc
          # P207 hai cache 300s het han doc lap nen day la luc lech lo ra.
          curl -s --max-time 40 -H "$H" "$BASE/api/sum-stats"     > /tmp/ss.json
          curl -s --max-time 40 -H "$H" "$BASE/api/triple-stats"  > /tmp/ts.json
          curl -s --max-time 40 -H "$H" "$BASE/api/draw-grid?n=200" > /tmp/g.json
          for f in ss ts g; do
            python3 -c "import json;json.load(open('/tmp/$f.json'))" 2>/dev/null || {
              echo "LOI: /tmp/$f.json khong phai JSON:"; head -c 200 /tmp/$f.json; echo; exit 1; }
          done
          python3 - <<'PYEOF'
          import json
          ss = json.load(open('/tmp/ss.json'))
          ts = json.load(open('/tmp/ts.json'))
          g  = json.load(open('/tmp/g.json'))['draws']
          sm = {x['sum']:   x['current_gap'] for x in ss['sums']}
          tt = {x['combo']: x                for x in ts['triples']}

          have = {d['draw_number'] for d in g}
          lo, hi = min(have), max(have)
          thieu = sorted(set(range(lo, hi + 1)) - have)
          print(f"Khoang #{lo}-#{hi}: thieu {len(thieu)} ky {thieu}\n")

          # tong 3 CHI ra duoc tu 111, tong 18 CHI ra duoc tu 666
          print("=== TONG 3 vs TRIP 111, TONG 18 vs TRIP 666 (bat buoc bang nhau) ===")
          lech = []
          for tong, combo in ((3, '111'), (18, '666')):
              a, b = sm[tong], tt[combo]['current_gap']
              if a != b:
                  lech.append(f"tong {tong}={a} nhung trip {combo}={b} (chenh {a-b})")
              print(f"  tong {tong:2d}: chua ve {a:4d} | trip {combo}: chua ve {b:4d}"
                    f" -> {'OK' if a == b else 'LECH'}")
          a, b = ss['total_draws'], ts['total_draws']
          if a != b:
              lech.append(f"total_draws: sum-stats {a} nhung triple-stats {b}")
          print(f"  total_draws: {a} vs {b} -> {'OK' if a == b else 'LECH'}")

          # P212: TRUNG VI tinh bang HAI DUONG CODE KHAC HAN NHAU — bang tong
          # bang SQL (LAG + ROW_NUMBER chay trong DB), bang trip bang vong lap
          # Python. Local chay SQLite nen cau SQL kia CHUA BAO GIO chay tren
          # Postgres that. Day la cho duy nhat kiem chung duoc.
          print()
          print("=== TRUNG VI: SQL (tong) vs Python (trip) ===")
          smv = {x['sum']: x.get('median_gap') for x in ss['sums']}
          for tong, combo in ((3, '111'), (18, '666')):
              m1, m2 = smv.get(tong), tt[combo].get('median_gap')
              ok = m1 == m2 and m1 is not None
              if not ok:
                  lech.append(f"trung vi tong {tong}={m1} nhung trip {combo}={m2}")
              print(f"  tong {tong:2d}: {m1} | trip {combo}: {m2} -> {'OK' if ok else 'LECH'}")
          thieu_tv = [x['sum'] for x in ss['sums'] if x.get('median_gap') is None]
          if thieu_tv:
              print(f"  (tong khong co trung vi: {thieu_tv})")
          # trung vi phai THAP HON trung binh — do la ly do them cot nay
          nguoc = [x['sum'] for x in ss['sums']
                   if x.get('median_gap') and x.get('avg_gap')
                   and x['median_gap'] > x['avg_gap']]
          print(f"  tong co trung vi > TB: {nguoc if nguoc else 'khong co (dung nhu mong doi)'}")

          print()
          print("=== LAN VE GAN NHAT CUA TUNG TRIP (theo bang) ===")
          for n in range(1, 7):
              c = str(n) * 3
              print(f"  {c}: chua ve {tt[c]['current_gap']:4d} ky -> ky #{tt[c]['last_draw']}")

          # Doi chieu nguoc: moi trip THAT SU co trong luoi phai duoc bang ghi
          # nhan. Neu luoi co 333 o ky X ma bang van bao lan cuoi la ky cu hon
          # X thi bang sai; neu ca hai deu khong co thi trip do that su chua ra.
          print()
          print(f"=== TRIP THAT SU CO TRONG {len(g)} KY GAN NHAT (#{lo}-#{hi}) ===")
          co = [d for d in g if len(set(d['numbers'])) == 1]
          if co:
              for d in sorted(co, key=lambda x: -x['draw_number']):
                  t = d['numbers'][0]
                  c = str(t) * 3
                  ghi = tt[c]['last_draw']
                  dau = 'OK' if ghi is not None and ghi >= d['draw_number'] else 'BANG BO SOT!'
                  if dau != 'OK':
                      lech.append(f"luoi co {c} o #{d['draw_number']} nhung bang ghi lan cuoi #{ghi}")
                  print(f"  #{d['draw_number']}  {t}x3   | bang ghi lan cuoi #{ghi} -> {dau}")
          else:
              print("  khong co trip nao")
          for n in range(1, 7):
              c = str(n) * 3
              if not any(d['numbers'] == [n, n, n] for d in g):
                  print(f"  {c}: KHONG ra trong {len(g)} ky nay")

          print()
          if lech:
              print(">>> HAI BANG LECH NHAU:")
              for x in lech: print("    " + x)
              open('/tmp/job_failed', 'a').write("bang tong vs bang trip lech nhau\n")
          else:
              print(">>> Hai bang cung mot moc — dung")
          PYEOF

      # P216: chuoi khoang cach dung ROW_NUMBER() ... rn <= 25 — cau nay CHUA
      # BAO GIO chay tren Postgres that (local la SQLite). Va CHIEU cua chuoi
      # la thu khong the nhin bang mat: dao nguoc thi moi con so van "hop ly".
      # Doi chieu voi luoi 200 ky — mot duong code hoan toan khac.
      - name: Chuỗi khoảng cách theo tổng (P216)
        env:
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: |
          BASE="https://bingo18-633959711537.asia-southeast1.run.app"
          TS=$(date +%s)
          H="X-Trigger-Secret: $TRIGGER_SECRET"
          curl -s --max-time 40 -H "$H" "$BASE/api/sum-stats?cb=$TS"       > /tmp/ss2.json
          curl -s --max-time 40 -H "$H" "$BASE/api/draw-grid?n=200&cb=$TS" > /tmp/g2.json
          for f in ss2 g2; do
            python3 -c "import json;json.load(open('/tmp/$f.json'))" 2>/dev/null || {
              echo "LOI: /tmp/$f.json khong phai JSON:"; head -c 200 /tmp/$f.json; echo; exit 1; }
          done
          python3 - <<'PYEOF'
          import json
          ss = {x['sum']: x for x in json.load(open('/tmp/ss2.json'))['sums']}
          g  = json.load(open('/tmp/g2.json'))['draws']
          loi = []

          print("=== CO TRUONG 'gaps' VA GIA TRI HOP LE ===")
          thieu = [s for s, x in ss.items() if not isinstance(x.get('gaps'), list)]
          if thieu:
              loi.append(f"tong khong co truong gaps: {thieu}")
          xau = [(s, x['gaps']) for s, x in ss.items()
                 if isinstance(x.get('gaps'), list)
                 and any((not isinstance(v, int)) or v <= 0 for v in x['gaps'])]
          if xau:
              loi.append(f"khoang cach <= 0 hoac khong phai so nguyen: {xau}")
          dai = [(s, len(x['gaps'])) for s, x in ss.items()
                 if isinstance(x.get('gaps'), list) and len(x['gaps']) > 24]
          if dai:
              loi.append(f"chuoi dai hon 24 (rn <= 25 khong an): {dai}")
          print(f"  16 tong co gaps      : {'OK' if not thieu else 'HONG'}")
          print(f"  moi khoang cach > 0  : {'OK' if not xau else 'HONG'}")
          print(f"  do dai <= 24         : {'OK' if not dai else 'HONG'}")

          # gaps[-1] va prev_gap lay tu CUNG mot truy van -> bat buoc bang nhau.
          # Lech = dao chieu hoac lech mot vi tri.
          print()
          print("=== gaps[-1] PHAI BANG prev_gap (cot 'Dot truoc' dang hien) ===")
          for s in sorted(ss):
              x = ss[s]
              gp, pv = x.get('gaps') or [], x.get('prev_gap')
              if not gp and pv is None:
                  continue
              cuoi = gp[-1] if gp else None
              if cuoi != pv:
                  loi.append(f"tong {s}: gaps[-1]={cuoi} nhung prev_gap={pv}")
              print(f"  tong {s:2d}: gaps[-1]={cuoi} | prev_gap={pv}"
                    f" -> {'OK' if cuoi == pv else 'LECH'}")

          # Doi chieu doc lap: tinh lai tu luoi. Chi xet tong xuat hien >= 2 lan
          # trong cua so — khoang cach vua chot nam tron trong cua so nen so
          # sanh duoc truc tiep.
          print()
          print("=== DOI CHIEU CHIEU CHUOI VOI LUOI 200 KY ===")
          lo = min(d['draw_number'] for d in g)
          theo_tong = {}
          for d in g:
              theo_tong.setdefault(d['sum'], []).append(d['draw_number'])
          da_xet = 0
          for s in sorted(theo_tong):
              dns = sorted(theo_tong[s])
              if len(dns) < 2 or s not in ss:
                  continue
              that = dns[-1] - dns[-2]        # khoang cach vua chot, tu LUOI
              gp = ss[s].get('gaps') or []
              if not gp:
                  continue
              da_xet += 1
              if gp[-1] != that:
                  loi.append(f"tong {s}: luoi tinh khoang cach cuoi = {that},"
                             f" bang tra {gp[-1]}")
              print(f"  tong {s:2d}: luoi {that:3d} | chuoi {gp[-1]:3d}"
                    f" -> {'OK' if gp[-1] == that else 'LECH'}")
          if da_xet < 8:
              loi.append(f"chi doi chieu duoc {da_xet} tong — cua so qua nho, khong ket luan duoc")
          print(f"  (doi chieu duoc {da_xet} tong tren cua so tu #{lo})")

          print()
          if loi:
              print(">>> CHUOI KHOANG CACH CO VAN DE:")
              for x in loi:
                  print("    " + x)
              open('/tmp/job_failed', 'a').write("chuoi khoang cach theo tong sai\n")
          else:
              print(">>> Chuoi khoang cach dung chieu va khop voi luoi")
          PYEOF

      # Nguoi dung hoi vi sao khong bao gio thay du doan tong 4/5/16/17.
      # Bon model thong ke deu chon "3 so tot nhat trong 1..6" nen khong bao gio
      # sinh so lap -> tong chi nam trong 6..15. Buoc nay DO tren du lieu that
      # thay vi suy luan tu code.
      - name: Phân bố TỔNG của các dự đoán gần đây
        continue-on-error: true
        env:
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: |
          BASE="https://bingo18-633959711537.asia-southeast1.run.app"
          curl -s --max-time 40 -H "X-Trigger-Secret: $TRIGGER_SECRET" \
               "$BASE/api/predictions?limit=200&cb=$(date +%s)" > /tmp/pd.json
          python3 -c "import json;json.load(open('/tmp/pd.json'))" 2>/dev/null || {
            echo "LOI: khong phai JSON:"; head -c 200 /tmp/pd.json; echo; exit 1; }
          python3 - <<'PYEOF'
          import json, collections
          d = json.load(open('/tmp/pd.json'))
          rows = d if isinstance(d, list) else (d.get('predictions') or d.get('data') or [])
          nums = []
          for r in rows:
              v = r.get('predicted_numbers')
              if isinstance(v, str):
                  try: v = json.loads(v)
                  except Exception: continue
              if isinstance(v, list) and len(v) == 3:
                  nums.append([int(x) for x in v])
          if not nums:
              print("Khong doc duoc du doan nao — bo qua."); raise SystemExit(0)
          print(f"Doc duoc {len(nums)} du doan gan nhat\n")
          tong = collections.Counter(sum(x) for x in nums)
          print("=== PHAN BO TONG DU DOAN ===")
          for s in range(3, 19):
              c = tong.get(s, 0)
              bar = '#' * min(40, c)
              print(f"  tong {s:2d}: {c:4d}  {bar}")
          thieu = [s for s in range(3, 19) if not tong.get(s)]
          print(f"\nTong KHONG he duoc du doan lan nao: {thieu}")
          lap = sum(1 for x in nums if len(set(x)) < 3)
          print(f"Du doan co SO LAP: {lap}/{len(nums)} = {lap/len(nums)*100:.1f}%")
          print("  (ky THAT co so lap: 44.4%)")
          bo = collections.Counter(tuple(sorted(x)) for x in nums)
          print(f"So bo khac nhau da dung: {len(bo)}/56")
          print("  5 bo hay dung nhat:", bo.most_common(5))
          PYEOF

      # 200 du doan gan nhat lech nang ve LON (147 vs 52). Cau hoi that su
      # dang gia: ti le THANG cua nhanh LON co khac nhanh NHO khong? Neu bang
      # nhau thi lech chi la thien lech vo hai; neu LON thap hon han thi cac
      # luat P45/P150 dang day sai huong. So sanh hai ti le bang z-test.
      - name: Tỉ lệ thắng tách theo SIZE đã dự đoán
        continue-on-error: true
        env:
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: |
          BASE="https://bingo18-633959711537.asia-southeast1.run.app"
          H="X-Trigger-Secret: $TRIGGER_SECRET"; TS=$(date +%s)
          curl -s --max-time 40 -H "$H" "$BASE/api/size-accuracy?n=1000&cb=$TS"  > /tmp/sa.json
          curl -s --max-time 40 -H "$H" "$BASE/api/size-confusion?n=1000&cb=$TS" > /tmp/sc.json
          for f in sa sc; do
            python3 -c "import json;json.load(open('/tmp/$f.json'))" 2>/dev/null || {
              echo "LOI: /tmp/$f.json khong phai JSON:"; head -c 200 /tmp/$f.json; echo; exit 1; }
          done
          python3 - <<'PYEOF'
          import json, math

          def lay(o, *ten):
              for t in ten:
                  if isinstance(o, dict) and t in o:
                      return o[t]
              return None

          sa = json.load(open('/tmp/sa.json'))
          rows = sa if isinstance(sa, list) else (lay(sa, 'sizes', 'data', 'rows') or [])
          print("=== TI LE THANG THEO SIZE DA DU DOAN (toi da 1000 ky da cham) ===")
          print("    thang = du doan dung SIZE\n")
          st = {}
          for r in rows:
              if not isinstance(r, dict):
                  continue
              k = lay(r, 'pred_size', 'size')
              n = lay(r, 'total', 'n', 'count')
              w = lay(r, 'wins', 'win')
              if k is None or not n:
                  continue
              n, w = int(n), int(w or 0)
              st[k] = (n, w)
              wr = w / n
              se = math.sqrt(wr * (1 - wr) / n)
              print(f"  {k:4s}: {w:4d}/{n:4d} = {wr*100:5.2f}%"
                    f"  (95% CI {max(0,wr-1.96*se)*100:5.2f}% .. {min(1,wr+1.96*se)*100:5.2f}%)")
          if not st:
              print("Khong doc duoc du lieu — bo qua."); raise SystemExit(0)

          print("\n  Nen so voi: doan NHO hay LON thi ti le trung ly thuyet deu la 37,5%")
          print("  (NHO 81/216, LON 81/216, HOA 54/216 — doan gi cung khong the vuot 37,5%")
          print("   neu cac ky doc lap nhau).")

          if 'LON' in st and 'NHO' in st:
              (nl, wl), (nn, wn) = st['LON'], st['NHO']
              pl, pn = wl / nl, wn / nn
              pp = (wl + wn) / (nl + nn)
              se = math.sqrt(pp * (1 - pp) * (1 / nl + 1 / nn))
              z  = (pl - pn) / se if se else 0.0
              pv = 2 * (1 - 0.5 * (1 + math.erf(abs(z) / math.sqrt(2))))
              print(f"\n=== LON vs NHO ===")
              print(f"  LON {pl*100:.2f}%  vs  NHO {pn*100:.2f}%   chenh {(pl-pn)*100:+.2f} diem")
              print(f"  z = {z:+.2f}   p = {pv:.3f}")
              if pv < 0.05:
                  print("  -> KHAC BIET CO Y NGHIA THONG KE. Nhanh yeu hon dang keo ket qua xuong.")
              else:
                  print("  -> Khong co y nghia thong ke: chenh lech nay giai thich duoc bang")
                  print("     ngau nhien. Viec doan LON nhieu hon khong tu no gay hai.")

          sc = json.load(open('/tmp/sc.json'))
          m = sc if isinstance(sc, list) else (lay(sc, 'matrix', 'confusion', 'data') or [])
          if m:
              print("\n=== MA TRAN: DU DOAN (hang) vs THUC TE (cot) ===")
              print(f"  {'':6s}" + "".join(f"{c:>8s}" for c in ('NHO', 'HOA', 'LON')))
              if isinstance(m, dict):
                  for pr in ('NHO', 'HOA', 'LON'):
                      hang = m.get(pr) or {}
                      print(f"  {pr:6s}" + "".join(f"{int(hang.get(a,0)):8d}" for a in ('NHO','HOA','LON')))
              else:
                  for r in m:
                      if isinstance(r, dict):
                          print("  " + json.dumps(r, ensure_ascii=False))
          PYEOF

      - name: Chốt kết quả
        if: always()
        run: |
          if [ -s /tmp/job_failed ]; then
            echo "=== CAC BUOC CO VAN DE ==="
            cat /tmp/job_failed
            exit 1
          fi
          if [ ! -f /tmp/quet_xong ]; then
            echo "LOI: buoc quet endpoint ket thuc giua chung — ket qua quet"
            echo "     KHONG dang tin. Xem log buoc 'Quet endpoint' o tren."
            exit 1
          fi
          echo "Tat ca cac buoc chan doan deu dat."
